# FALLBACK ONLY — use this if you have no machine that can stay on.
#
# GitHub's scheduled runners fire every 5 minutes at best, and in practice
# are often 5-15 minutes late. That is NOT real time. Stories can also expire
# before a delayed run sees them. Prefer `docker compose up -d` on any
# always-on machine, or the Fly.io deploy.
#
# Required repository secrets:
#   IG_USERNAME, IG_PASSWORD, NTFY_TOPIC, (optional) ANTHROPIC_API_KEY

name: poll instagram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: insta-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Carries the dedup database and the Instagram session between runs.
      # Without this every run re-notifies everything.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: insta-state-${{ github.run_id }}
          restore-keys: insta-state-

      - name: Poll
        env:
          PYTHONPATH: src
          IG_TARGET_USERNAME: zero2sudo
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          NOTIFY_BACKEND: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_DIR: data
        run: python -m insta_notify once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: insta-state-${{ github.run_id }}
