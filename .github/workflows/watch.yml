# 24/7 watcher on GitHub's free runners — no machine of your own.
#
# STATUS: deployed and running. The only thing it still needs is an Instagram
# session, which only you can supply. Until it has one, every few hours it
# pushes a reminder to your phone with a direct link to the form.
#
#   Add secret IG_SESSIONID  ->  https://github.com/DevDesai444/insta-notifications/settings/secrets/actions/new
#   Full instructions        ->  RUN_ON_GITHUB.md
#
# How it stays up without a server:
#   * A job can run up to 6 hours, so each shift watches for 5h30m.
#   * A cron fires every 5 minutes. If a shift is already running, that run
#     exits in ~15s. If none is, it starts the next shift.
#   * The dedup database and Instagram session ride between shifts in the
#     Actions cache, so you never get repeat notifications.

name: watch instagram

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "How long this shift should watch for"
        default: "5h30m"
        required: false
  # A push starts a shift immediately. GitHub's scheduler can take a long
  # while to pick up a newly added cron -- and can drop firings entirely --
  # so this is the one trigger that reliably gets things moving right now.
  # The in-progress guard means a push during an active shift costs ~10s.
  push:
    branches: [claude/instagram-newgrad-notifications-1nxoju]
  schedule:
    # Primary: check every 5 minutes whether a shift needs starting.
    - cron: "*/5 * * * *"
    # Backstop. GitHub deprioritises high-frequency crons under load and can
    # drop them outright, which would leave no shift running. This second
    # entry is far more likely to survive; the odd minute avoids the
    # on-the-hour stampede that makes :00 the worst slot to ask for.
    - cron: "23 * * * *"

permissions:
  actions: read
  contents: read

env:
  # A topic was generated for you so there is nothing to configure to start
  # receiving. Subscribe to it in the ntfy iOS app.
  #
  # This repo is public, so this topic name is public: anyone who reads it
  # could publish to your phone. To lock it down, add a repository secret
  # named NTFY_TOPIC with a new private name — it overrides this default.
  DEFAULT_NTFY_TOPIC: zero2sudo-f5bf63a219

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # Everything cheap happens here, before checkout and pip install, so a
      # firing that has nothing to do costs ~10 seconds instead of ~2 minutes.
      # At one firing every 5 minutes that difference is most of a runner-day.
      - name: Decide whether to start a shift
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SESSIONID: ${{ secrets.IG_SESSIONID != '' }}
          HAS_PASSWORD: ${{ secrets.IG_USERNAME != '' && secrets.IG_PASSWORD != '' }}
          TOPIC: ${{ secrets.NTFY_TOPIC || env.DEFAULT_NTFY_TOPIC }}
        run: |
          set -euo pipefail

          running=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/runs?status=in_progress&per_page=100" \
            --jq '[.workflow_runs[].id] | length')
          echo "in-progress runs (this one included): $running"
          # This run counts itself, so >1 means someone else is already on shift.
          if [ "$running" -gt 1 ]; then
            echo "another shift is active — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HAS_SESSIONID" != "true" ] && [ "$HAS_PASSWORD" != "true" ]; then
            echo "::warning::No Instagram sign-in configured. Add a repository secret named IG_SESSIONID — see RUN_ON_GITHUB.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"

            # Nudge the phone, but not 288 times a day: roughly every 6 hours,
            # plus once whenever somebody presses Run workflow by hand.
            hour=$(date -u +%-H); minute=$(date -u +%-M)
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
               || { [ $((hour % 6)) -eq 0 ] && [ "$minute" -lt 5 ]; }; then
              secrets_url="https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions/new"
              guide_url="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/RUN_ON_GITHUB.md"
              printf '%s' "{
                \"topic\": \"${TOPIC}\",
                \"title\": \"⚙️ Almost there — 1 step left\",
                \"message\": \"Your @zero2sudo watcher is deployed and running on GitHub. It just needs to be signed in to Instagram — stories are invisible to logged-out visitors.\\n\\nOn a desktop:\\n1. Log in to instagram.com\\n2. F12 → Application → Cookies → instagram.com\\n3. Copy the value of the sessionid cookie\\n4. Tap below, name the secret IG_SESSIONID, paste, save\\n\\nNotifications start within ~5 minutes of saving it.\",
                \"priority\": 4,
                \"tags\": [\"gear\"],
                \"click\": \"${secrets_url}\",
                \"actions\": [
                  {\"action\": \"view\", \"label\": \"Add the secret\", \"url\": \"${secrets_url}\"},
                  {\"action\": \"view\", \"label\": \"Instructions\", \"url\": \"${guide_url}\"}
                ]
              }" | curl -sS --max-time 20 -X POST https://ntfy.sh -H "Content-Type: application/json" -d @- \
                && echo "reminder pushed to the phone" || echo "could not reach ntfy"
            fi
            exit 0
          fi

          echo "credentials present — starting a shift"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Preflight
        id: preflight
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHONPATH: src
          DATA_DIR: data
          IG_TARGET_USERNAME: zero2sudo
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          NOTIFY_BACKEND: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || env.DEFAULT_NTFY_TOPIC }}
        run: |
          python -m insta_notify preflight --quiet
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Carries the dedup database and Instagram session between shifts.
      - name: Restore state
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: insta-state-${{ github.run_id }}
          restore-keys: |
            insta-state-

      - name: Watch
        if: steps.preflight.outputs.ready == 'true'
        env:
          PYTHONPATH: src
          DATA_DIR: data
          IG_TARGET_USERNAME: zero2sudo
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_TOTP_SEED: ${{ secrets.IG_TOTP_SEED }}
          NOTIFY_BACKEND: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || env.DEFAULT_NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POLL_INTERVAL_SECONDS: "60"
          NOTIFY_ALL: "true"
        run: python -m insta_notify run --duration "${{ inputs.duration || '5h30m' }}"

      # `always()` so a cancelled or timed-out shift still hands its state on.
      - name: Save state
        if: always() && steps.preflight.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: insta-state-${{ github.run_id }}
